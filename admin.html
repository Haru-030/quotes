<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Archive — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #2a2a3a;
      --accent: #c8a96e;
      --accent-dim: rgba(200, 169, 110, 0.15);
      --text: #e8e4dc;
      --text-dim: #6b6878;
      --red: #e05c5c;
      --green: #5ce08a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      padding: 40px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(200,169,110,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 28px;
      margin-bottom: 40px;
    }

    .header-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Noto Serif KR', serif;
      font-weight: 300;
      font-size: 28px;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* TOKEN SECTION */
    #token-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 24px;
      margin-bottom: 32px;
      position: relative;
    }

    #token-section.hidden { display: none; }

    .section-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .token-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .token-status {
      font-size: 11px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .token-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    input[type="text"], input[type="password"], textarea {
      background: #0d0d14;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 180px;
      line-height: 1.5;
    }

    /* FORM */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .field-hint {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .filename-row {
      display: flex;
      gap: 10px;
    }

    .filename-row input {
      flex: 1;
    }

    /* BUTTONS */
    button {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      padding: 10px 20px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0a0f;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: #dfc080;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(200,169,110,0.3);
    }

    .btn-primary:disabled {
      background: var(--border);
      color: var(--text-dim);
      transform: none;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }

    .btn-small {
      padding: 8px 14px;
      font-size: 10px;
    }

    /* PREVIEW */
    #preview-wrap {
      display: none;
      margin-top: 8px;
    }

    #preview-wrap.visible { display: block; }

    #preview-frame {
      width: 100%;
      height: 400px;
      border: 1px solid var(--border);
      background: #fff;
    }

    /* STATUS */
    #status {
      display: none;
      padding: 14px 18px;
      font-size: 11px;
      letter-spacing: 1px;
      border-left: 3px solid;
      margin-top: 16px;
    }

    #status.success {
      display: block;
      background: rgba(92,224,138,0.08);
      border-color: var(--green);
      color: var(--green);
    }

    #status.error {
      display: block;
      background: rgba(224,92,92,0.08);
      border-color: var(--red);
      color: var(--red);
    }

    #status.loading {
      display: block;
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* SAVED LIST */
    #saved-list {
      margin-top: 48px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(42,42,58,0.5);
      font-size: 11px;
    }

    .file-name {
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .file-name:hover { text-decoration: underline; }

    .file-date {
      color: var(--text-dim);
      font-size: 10px;
    }

    .file-actions {
      display: flex;
      gap: 8px;
    }

    .copy-btn {
      font-size: 9px;
      padding: 4px 10px;
      letter-spacing: 1px;
    }

    /* DIVIDER */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 48px 0;
    }

    /* SUBMIT ROW */
    .submit-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* SPINNING */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <div class="header-label">Story Archive / Admin</div>
      <h1>Log <span>Upload</span></h1>
      <div class="subtitle">RISUAI 로그를 GitHub에 직접 저장</div>
    </header>

    <!-- TOKEN -->
    <div id="token-section">
      <div class="section-label">GitHub Token 설정</div>
      <div class="token-row">
        <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" style="flex:1" />
        <button class="btn-primary btn-small" onclick="saveToken()">저장</button>
      </div>
      <div class="field-hint" style="margin-top:10px">토큰은 이 브라우저에만 저장되며 외부로 전송되지 않아요.</div>
    </div>

    <div id="token-ok" class="hidden">
      <div class="token-status">
        <span class="dot"></span>
        <span>Token 연결됨</span>
        <button class="btn-secondary btn-small" onclick="clearToken()" style="margin-left:8px">변경</button>
      </div>
    </div>

    <hr class="divider" style="margin: 28px 0 36px">

    <!-- UPLOAD FORM -->
    <div class="form-section">

      <div class="field">
        <div class="field-label">파일 이름</div>
        <div class="filename-row">
          <input type="text" id="filename" placeholder="예: chapter1-4.html" />
          <button class="btn-secondary btn-small" onclick="autoFilename()">자동 생성</button>
        </div>
        <div class="field-hint">quotes/ 폴더에 저장됩니다 → <span id="filepath-preview" style="color:var(--accent)">quotes/파일명.html</span></div>
      </div>

      <div class="field">
        <div class="field-label">커밋 메시지 <span style="color:var(--text-dim)">(선택)</span></div>
        <input type="text" id="commit-msg" placeholder="Add chapter log" />
      </div>

      <div class="field">
        <div class="field-label">HTML 로그 붙여넣기</div>
        <textarea id="html-input" placeholder="RISUAI에서 복사한 HTML/CSS를 여기에 붙여넣으세요..."></textarea>
        <div class="field-hint" id="char-count" style="text-align:right">0 chars</div>
      </div>

      <div class="field">
        <div class="field-label">미리보기 <span style="color:var(--text-dim)">(선택)</span></div>
        <button class="btn-secondary btn-small" onclick="togglePreview()" style="align-self:flex-start">미리보기 열기</button>
        <div id="preview-wrap">
          <iframe id="preview-frame" sandbox="allow-scripts"></iframe>
        </div>
      </div>

      <div class="submit-row">
        <button class="btn-primary" id="save-btn" onclick="saveToGitHub()">GitHub에 저장</button>
        <button class="btn-secondary" onclick="clearForm()">초기화</button>
      </div>

      <div id="status"></div>
    </div>

    <!-- SAVED FILES LIST -->
    <div id="saved-list">
      <hr class="divider" style="margin-top:0">
      <div class="list-header">
        <div class="section-label" style="margin-bottom:0">저장된 로그</div>
        <button class="btn-secondary btn-small" onclick="loadFileList()">새로고침</button>
      </div>
      <div id="file-list-content">
        <div style="font-size:11px; color:var(--text-dim)">토큰을 설정하면 파일 목록이 표시됩니다.</div>
      </div>
    </div>

  </div>

  <script>
    const REPO = 'Haru-030/quotes';
    const FOLDER = 'quotes';

    // ── TOKEN ──────────────────────────────────────────────
    function getToken() {
      return localStorage.getItem('gh_token');
    }

    function saveToken() {
      const t = document.getElementById('token-input').value.trim();
      if (!t) return;
      localStorage.setItem('gh_token', t);
      showTokenStatus();
      loadFileList();
    }

    function clearToken() {
      localStorage.removeItem('gh_token');
      document.getElementById('token-section').classList.remove('hidden');
      document.getElementById('token-ok').classList.add('hidden');
      document.getElementById('token-input').value = '';
    }

    function showTokenStatus() {
      document.getElementById('token-section').classList.add('hidden');
      document.getElementById('token-ok').classList.remove('hidden');
    }

    // ── FILENAME ───────────────────────────────────────────
    function autoFilename() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth()+1).padStart(2,'0');
      const d = String(now.getDate()).padStart(2,'0');
      document.getElementById('filename').value = `log-${y}${m}${d}.html`;
      updateFilepathPreview();
    }

    function updateFilepathPreview() {
      const fn = document.getElementById('filename').value.trim() || '파일명.html';
      const full = fn.endsWith('.html') ? fn : fn + '.html';
      document.getElementById('filepath-preview').textContent = `${FOLDER}/${full}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('filename').addEventListener('input', updateFilepathPreview);
      document.getElementById('html-input').addEventListener('input', updateCharCount);

      if (getToken()) {
        showTokenStatus();
        loadFileList();
      }

      autoFilename();
    });

    function updateCharCount() {
      const len = document.getElementById('html-input').value.length;
      document.getElementById('char-count').textContent = `${len.toLocaleString()} chars`;
    }

    // ── PREVIEW ────────────────────────────────────────────
    let previewOpen = false;

    function togglePreview() {
      previewOpen = !previewOpen;
      const wrap = document.getElementById('preview-wrap');
      wrap.classList.toggle('visible', previewOpen);
      if (previewOpen) {
        const html = document.getElementById('html-input').value;
        const frame = document.getElementById('preview-frame');
        frame.srcdoc = html;
      }
    }

    // ── SAVE ───────────────────────────────────────────────
    async function saveToGitHub() {
      const token = getToken();
      if (!token) { setStatus('error', '먼저 GitHub Token을 설정해주세요.'); return; }

      let filename = document.getElementById('filename').value.trim();
      if (!filename) { setStatus('error', '파일 이름을 입력해주세요.'); return; }
      if (!filename.endsWith('.html')) filename += '.html';

      const html = document.getElementById('html-input').value.trim();
      if (!html) { setStatus('error', 'HTML 내용을 붙여넣어주세요.'); return; }

      const commitMsg = document.getElementById('commit-msg').value.trim() || `Add ${filename}`;
      const path = `${FOLDER}/${filename}`;

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      setStatus('loading', '<span class="spinner"></span>저장 중...');

      try {
        // Check if file exists (to get sha for update)
        let sha = null;
        const checkRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
        });
        if (checkRes.ok) {
          const existing = await checkRes.json();
          sha = existing.sha;
        }

        const body = {
          message: commitMsg,
          content: btoa(unescape(encodeURIComponent(html))),
        };
        if (sha) body.sha = sha;

        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const url = `https://haru-030.github.io/quotes/${path.replace('quotes/', 'quotes/')}`;
        setStatus('success', `✓ 저장 완료! <a href="${data.content.html_url}" target="_blank" style="color:var(--green)">GitHub에서 보기</a> &nbsp;·&nbsp; <a href="https://haru-030.github.io/quotes/${FOLDER}/${filename}" target="_blank" style="color:var(--green)">Pages URL</a>`);
        loadFileList();

      } catch(e) {
        setStatus('error', `오류: ${e.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    // ── LOAD FILE LIST ─────────────────────────────────────
    async function loadFileList() {
      const token = getToken();
      if (!token) return;

      const container = document.getElementById('file-list-content');
      container.innerHTML = '<div style="font-size:11px;color:var(--text-dim)">불러오는 중...</div>';

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`, {
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const files = await res.json();

        const htmlFiles = files.filter(f => f.name.endsWith('.html')).reverse();

        if (htmlFiles.length === 0) {
          container.innerHTML = '<div style="font-size:11px;color:var(--text-dim)">아직 저장된 파일이 없어요.</div>';
          return;
        }

        container.innerHTML = htmlFiles.map(f => {
          const pageUrl = `https://haru-030.github.io/quotes/${FOLDER}/${f.name}`;
          return `
            <div class="file-item">
              <a class="file-name" href="${f.html_url}" target="_blank">${f.name}</a>
              <div class="file-actions">
                <button class="btn-secondary copy-btn" onclick="copyEmbedUrl('${pageUrl}')">embed URL 복사</button>
                <button class="btn-secondary copy-btn" onclick="loadIntoEditor('${f.download_url}', '${f.name}')">수정</button>
              </div>
            </div>`;
        }).join('');

      } catch(e) {
        container.innerHTML = `<div style="font-size:11px;color:var(--red)">파일 목록을 불러오지 못했어요: ${e.message}</div>`;
      }
    }

    async function loadIntoEditor(downloadUrl, filename) {
      const token = getToken();
      try {
        const res = await fetch(downloadUrl, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const text = await res.text();
        document.getElementById('html-input').value = text;
        document.getElementById('filename').value = filename;
        updateCharCount();
        updateFilepathPreview();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setStatus('loading', `"${filename}" 불러왔어요. 수정 후 저장하면 덮어씁니다.`);
      } catch(e) {
        setStatus('error', `파일을 불러오지 못했어요: ${e.message}`);
      }
    }

    function copyEmbedUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        setStatus('success', `✓ 클립보드에 복사됐어요: ${url}`);
      });
    }

    // ── UTILS ──────────────────────────────────────────────
    function clearForm() {
      document.getElementById('html-input').value = '';
      document.getElementById('commit-msg').value = '';
      document.getElementById('status').style.display = 'none';
      document.getElementById('status').className = '';
      updateCharCount();
      autoFilename();
    }

    function setStatus(type, html) {
      const el = document.getElementById('status');
      el.className = type;
      el.innerHTML = html;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
